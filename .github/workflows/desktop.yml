name: Desktop
# The desktop shell (Tauri) is built only when its own inputs change, so the
# web CI (tests.yml) stays untouched and this job does not run on web-only
# pushes. Manual dispatch is always available.
on:
  push:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/desktop-auth.js'
      - 'scripts/copy-maplibre-worker.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/desktop-auth.js'
      - 'scripts/copy-maplibre-worker.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      # Job level, never per step (AGENTS.md): every rustc invocation must go
      # through sccache; the `sccache --version` step below fails the job
      # closed if the wrapper is not actually on PATH.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          cache: npm
      - run: mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
      - run: npm ci --no-audit --no-fund
      # Static export with the MapLibre worker adjacent to its shared chunk.
      - run: npm run build:desktop
      # Verify the exported desktop landing screen and native sign-in bridge.
      - run: npm run test:desktop
      # Catch hydration and runtime errors in a real headless browser load.
      - run: npx playwright install chromium
      - run: npm run test:desktop:console
      - run: npm run test:desktop:setup
      - run: npm run test:desktop:theme
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Keep this channel and component set aligned with rust-toolchain.toml.
          toolchain: '1.96.0'
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: sccache --version
      - run: cargo check --locked --workspace --all-targets --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --workspace --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # No Apple signing secrets in CI: this compiles the app, it does not
      # bundle or sign a distributable. "Needs Sami: Apple signing".
      - run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml
