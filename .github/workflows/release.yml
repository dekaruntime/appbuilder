name: Release bundles
# Builds the distributables (dmg / NSIS / AppImage) plus their Tauri updater
# payloads for all three platforms, the package-manager builds (.deb and the
# arch `zega` package, both --features packaged, updater compiled out), and
# proves the release manifest pipeline in a dry run — all with throwaway keys
# that exist only inside the run. NOTHING is signed for real or uploaded
# here: this repo is public and runs only on GitHub-hosted runners. Signing
# and publishing happen outside it, on the one machine that holds the keys
# (APS 37 rule 1: the keys never leave the publishing machine).
# Apple notarization and Azure Trusted Signing land with their secrets; until
# then macOS installs need right-click → Open once and Windows shows
# SmartScreen once.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/desktop-auth.js'
      - 'scripts/**'
      - 'packaging/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/desktop-auth.js'
      - 'scripts/**'
      - 'packaging/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    name: Bundle ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub-hosted runners only: this repo is public, and a pull
          # request from a fork must never reach a self-hosted runner.
          - platform: macos
            runs-on: macos-15
            bundles: app,dmg
          - platform: windows
            runs-on: windows-2025
            bundles: nsis
          - platform: linux
            runs-on: ubuntu-24.04
            bundles: appimage
    runs-on: ${{ matrix.runs-on }}
    # One shell on every platform: Windows runners default to PowerShell,
    # and every step here is bash (Git for Windows' bash on the runner).
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Job level, never per step (AGENTS.md): every rustc invocation must go
      # through sccache; the `sccache --version` step fails the job closed if
      # the wrapper is not actually on PATH.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          cache: npm
      - run: mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --no-audit --no-fund
      - run: npm run build:desktop
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.96.0'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: sccache --version
      # CI has no real signing key (APS 37 rule 1: it never leaves the
      # publishing machine). `tauri build` insists on signing when a pubkey is
      # configured, so it gets a throwaway key created in $TMPDIR for this run
      # only; scripts/publish-release.mjs re-signs every payload with zega's
      # real key at publish time, so these signatures never reach a user.
      - name: Throwaway updater key for this run only
        run: |
          node_modules/.bin/tauri signer generate -w "$TMPDIR/ci-throwaway.key" -p "" -f
          # Tauri accepts a path here; the key file has no trailing newline,
          # so a heredoc delimiter appended after it would never match.
          key="$TMPDIR/ci-throwaway.key"
          # Git bash on Windows hands native programs /c/... paths unconverted.
          if command -v cygpath >/dev/null; then key=$(cygpath -m "$key"); fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=' >> "$GITHUB_ENV"
        shell: bash
      # Name the bundles: updater archives come only from app/nsis/appimage.
      - run: node_modules/.bin/tauri build --bundles ${{ matrix.bundles }}
        shell: bash
      # The macOS updater tarball is named plain `zega.app.tar.gz`; the
      # publish script fails closed on payloads whose arch it cannot tell, so
      # name it for the runner's arch (macos-15 is Apple Silicon).
      - if: matrix.platform == 'macos'
        run: mv .target/release/bundle/macos/zega.app.tar.gz .target/release/bundle/macos/zega-aarch64.app.tar.gz
      # Prove the manifest pipeline end to end with the same throwaway key:
      # sign the payloads, write canary.json, print it. --dry-run never
      # touches the network or the bucket.
      - name: Dry-run release manifest (throwaway key)
        run: |
          node scripts/publish-release.mjs --version 0.0.0-canary-ci --channel canary \
            --key "$TMPDIR/ci-throwaway.key" --artifacts .target/release/bundle \
            --dry-run --out "$TMPDIR/dry-run-out"
          cat "$TMPDIR/dry-run-out/canary.json"
        shell: bash
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            .target/release/bundle/**/*.dmg
            .target/release/bundle/**/*.app.tar.gz
            .target/release/bundle/**/*.exe
            .target/release/bundle/**/*.nsis.zip
            .target/release/bundle/**/*.AppImage
            .target/release/bundle/**/*.AppImage.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: manifest-dry-run-${{ matrix.platform }}
          path: ${{ github.workspace }}/.tmp/dry-run-out/
          if-no-files-found: error
  bundle-linux-deb:
    name: Bundle linux .deb (packaged)
    # Package-manager build (APS 37): --features packaged compiles the
    # updater out and tauri.packaged.conf.json strips the updater endpoints,
    # so apt owns updates and no endpoint string reaches the binary. Lives
    # next to (never inside) the AppImage job; outputs share no file.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          cache: npm
      - run: mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --no-audit --no-fund
      - run: npm run build:desktop
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.96.0'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: sccache --version
      # Same throwaway-key shape as the bundle job: CI never holds a real key;
      # the deb is signed later by publish-release.mjs with the packages key.
      - name: Throwaway updater key for this run only
        run: |
          node_modules/.bin/tauri signer generate -w "$TMPDIR/ci-throwaway.key" -p "" -f
          key="$TMPDIR/ci-throwaway.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=' >> "$GITHUB_ENV"
        shell: bash
      - run: node_modules/.bin/tauri build --bundles deb --features packaged --config src-tauri/tauri.packaged.conf.json
        shell: bash
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bundles-linux-deb
          path: .target/release/bundle/**/*.deb
          if-no-files-found: error
  bundle-linux-arch:
    name: Bundle arch zega package (packaged)
    # makepkg runs inside a throwaway archlinux container (no secrets;
    # the package is signed later by publish-release.mjs). The Rust build in
    # the container goes through sccache (packaging/arch/PKGBUILD fails closed
    # without it).
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
      - run: mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
      - run: packaging/arch/build-in-docker.sh "$TMPDIR/arch"
        shell: bash
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bundles-linux-arch
          path: ${{ github.workspace }}/.tmp/arch/*.pkg.tar.zst
          if-no-files-found: error
  updater-e2e:
    name: Updater end-to-end proof
    # The proof needs a real desktop session for the tray app (hosted macOS
    # runners have one); it runs the full update → relaunch cycle against a
    # local fake update server.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          cache: npm
      - run: mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
      - run: npm ci --no-audit --no-fund
      - run: npm run build:desktop
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.96.0'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: sccache --version
      - run: node tests/updater-e2e.mjs all
