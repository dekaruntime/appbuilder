name: Native launcher experiment
on:
  pull_request:
    paths: ['native/**', 'src-tauri/computer-index/**', 'src-tauri/src/shortcut_config.rs', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: mkdir -p "$TMPDIR" && chmod 700 "$TMPDIR"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Keep this channel and component set aligned with rust-toolchain.toml.
          toolchain: '1.96.0'
          components: clippy, rustfmt
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: sccache --version
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo check --locked --workspace --all-targets --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --workspace --all-targets --all-features --manifest-path native/Cargo.toml -- -D warnings
      - run: cargo test --locked --release --manifest-path native/Cargo.toml --features compiler --test launcher
      - run: cargo build --locked --release --manifest-path native/Cargo.toml
