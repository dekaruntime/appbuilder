[package]
name = "computer-index"
version = "0.1.0"
edition = "2021"

[dependencies]
zega = { git = "https://github.com/zegadb/zega", rev = "2082501631b534c379df73150dd26eebcc80d529", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8"
file-id = "0.2"
kamadak-exif = "0.6"
imagesize = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
thread-priority = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
