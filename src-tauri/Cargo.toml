[package]
name = "zega-desktop"
version = "0.1.0"
description = "zega desktop shell (Tauri)"
edition = "2021"

[lib]
name = "zega_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "blocking", "json"] }
keyring = { version = "3", features = ["apple-native"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"
plist = "1"
