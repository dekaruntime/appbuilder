[package]
name = "zega-desktop"
version = "0.1.0"
description = "zega desktop shell (Tauri)"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "zega_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = ["computer-index"]
resolver = "2"

[features]
# `packaged` compiles the in-app updater OUT (APS 37 package-manager rule):
# apt, pacman, Homebrew and winget own updates for installs they made, and the
# choice is fixed at build time. Direct downloads (dmg, exe, AppImage) are
# built without this feature and self-update.
packaged = []

[dependencies]
computer-index = { path = "computer-index" }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "blocking", "json"] }
keyring = { version = "3", features = ["apple-native"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
plist = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "macros", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSPathUtilities", "NSString", "NSProcessInfo"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gtk = "0.18"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
notify = "8.2"
toml = "1.1.6"

[dev-dependencies]
toml = "1.1.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_NetworkManagement_WiFi", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

# Compile the portal adapter in macOS tests too; hardware dispatch still needs Linux.
[target.'cfg(target_os = "macos")'.dev-dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
