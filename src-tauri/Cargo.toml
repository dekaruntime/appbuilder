[package]
name = "zega-desktop"
version = "0.1.0"
description = "zega desktop shell (Tauri)"
edition = "2021"

[lib]
name = "zega_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "blocking", "json"] }
keyring = { version = "3", features = ["apple-native"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
plist = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "macros", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSPathUtilities", "NSString"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
gtk = "0.18"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
notify = "8.2"
toml = "1.1.6"

[dev-dependencies]
toml = "1.1.6"

# Compile the portal adapter in macOS tests too; hardware dispatch still needs Linux.
[target.'cfg(target_os = "macos")'.dev-dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
